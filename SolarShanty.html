  <!--
    TC-049 Part 0 (mirror publish flow): this file used to BE the shipped
    single-file build, kept in sync by hand alongside index.html. That sync
    step silently stopped happening somewhere around v0.1.29 (2026-07-16),
    while index.html kept getting refreshed every round — so any old
    link/bookmark pointing at SolarShanty.html served a nine-versions-stale
    build with no way to notice. Structural fix, not a one-time re-sync:
    this is now a permanent, content-free redirect to index.html (the one
    and only shipped playable in this repo), so there is no second copy
    left to drift. tools/publish.sh in the private repo no longer writes to
    this file at all — see its header comment.
  -->
  <p>Solar Shanty has moved to <a href="index.html">index.html</a> — redirecting…</p>
</body>
